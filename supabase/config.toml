# Supabase project configuration for RoadPing
# Generated manually — run `supabase init` to regenerate with your project details.
# After running `supabase init`, replace this file with the generated one and
# add your project_id (found in Supabase Dashboard → Project Settings → General).

project_id = "roadping"   # <-- replace with your project ref (e.g. "xyzabcdefgh")

[api]
enabled     = true
port        = 54321
schemas     = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows    = 1000

[db]
port         = 54322
shadow_port  = 54320
major_version = 17

[studio]
enabled  = true
port     = 54323
api_url  = "http://127.0.0.1"

[inbucket]
enabled   = true
port      = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled         = true
file_size_limit = "50MiB"

[auth]
enabled                       = true
site_url                      = "http://127.0.0.1:3000"
additional_redirect_urls      = ["https://127.0.0.1:3000", "roadping://"]
jwt_expiry                    = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval  = 10
enable_signup                 = true
enable_anonymous_sign_ins     = false

[auth.email]
enable_signup         = true
double_confirm_changes = true
enable_confirmations  = false  # set true in production

[realtime]
enabled = true

[analytics]
enabled = false
port    = 54327
